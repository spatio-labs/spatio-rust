[package]
name = "spatio-sdk"
version = "0.0.1"
authors = ["Spatio Labs <hello@spatio.app>"]
description = "Rust SDK for the SpatioAPI. Generated from the official OpenAPI spec."
license = "MIT"
edition = "2021"
homepage = "https://www.spatio.app/developers/docs/sdk"
repository = "https://github.com/spatio-labs/spatio"
documentation = "https://www.spatio.app/developers/docs/sdk"
keywords = ["spatio", "sdk", "api", "openapi"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
chrono = { version = "^0.4",  features = ["serde"] }
tokio = { version = "^1.46.0", features = ["fs"] }
tokio-util = { version = "^0.7", features = ["codec"] }
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "stream", "query", "form"] }

[features]
default = ["native-tls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
